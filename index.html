<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テイクアウト注文（デモ）</title>
    <script src="https://static.line-scdn.net/liff/edge/2.1/sdk.js"></script>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
            color: #333;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px 15px 40px 15px;
            box-sizing: border-box;
        }

        h2 {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #2c3e50;
            text-align: center;
        }

        .subtitle {
            font-size: 13px;
            color: #7f8c8d;
            text-align: center;
            margin-bottom: 25px;
            margin-top: 0;
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin: 25px 0 10px 5px;
            color: #2c3e50;
        }

        .menu-list {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #f1f2f6;
            box-sizing: border-box;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .menu-img {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 8px;
            margin-right: 15px;
            background-color: #eee;
        }

        .menu-info {
            flex: 1;
        }

        .menu-name {
            font-weight: bold;
            font-size: 15px;
            color: #2d3436;
            margin-bottom: 4px;
        }

        .menu-price {
            font-size: 14px;
            color: #e74c3c;
            font-weight: 600;
        }

        .menu-qty select {
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            background-color: #fff;
            outline: none;
        }

        .menu-qty select:disabled {
            background-color: #e9ecef;
            color: #6c757d;
        }

        .input-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #4a5568;
        }

        .required {
            color: #e74c3c;
            font-size: 11px;
            background: #ffeaa7;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 5px;
        }

        .input-card input,
        .input-card select {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            background-color: #fff;
        }

        .total-card {
            background: #2c3e50;
            color: white;
            border-radius: 12px;
            padding: 15px 20px;
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        .total-label {
            font-size: 15px;
            font-weight: 500;
        }

        .total-price {
            font-size: 22px;
            font-weight: bold;
            color: #f1c40f;
        }

        .submit-btn {
            background-color: #06C755;
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            margin-top: 20px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(6, 199, 85, 0.3);
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>テイクアウト注文</h2>
        <p class="subtitle">ご希望の商品と数量、お受け取り日時を選択してください。</p>
        <form id="orderForm">
            <div class="section-title">📦 メニュー</div>
            <div class="menu-list">
                <div class="menu-item">
                    <img src="https://placehold.co" alt="鶏のピカタ弁当" class="menu-img">
                    <div class="menu-info">
                        <div class="menu-name">鶏のピカタ弁当</div>
                        <div class="menu-price">¥850 (税込)</div>
                    </div>
                    <div class="menu-qty">
                        <select class="menu-qty-select" data-name="鶏のピカタ弁当" data-price="850">
                            <option value="0">0個</option>
                            <option value="1">1個</option>
                            <option value="2">2個</option>
                            <option value="3">3個</option>
                            <option value="4">4個</option>
                            <option value="5">5個</option>
                        </select>
                    </div>
                </div>
                <div class="menu-item">
                    <img src="https://placehold.co" alt="彩り野菜弁当" class="menu-img">
                    <div class="menu-info">
                        <div class="menu-name">彩り野菜弁当</div>
                        <div class="menu-price">¥900 (税込)</div>
                    </div>
                    <div class="menu-qty">
                        <select class="menu-qty-select" data-name="彩り野菜弁当" data-price="900">
                            <option value="0">0個</option>
                            <option value="1">1個</option>
                            <option value="2">2個</option>
                            <option value="3">3個</option>
                            <option value="4">4個</option>
                            <option value="5">5個</option>
                        </select>
                    </div>
                </div>
                <div class="menu-item">
                    <img src="https://placehold.co" alt="焼き肉弁当" class="menu-img">
                    <div class="menu-info">
                        <div class="menu-name">焼き肉弁当</div>
                        <div class="menu-price">¥850 (税込)</div>
                    </div>
                    <div class="menu-qty">
                        <select class="menu-qty-select" data-name="焼き肉弁当" data-price="850">
                            <option value="0">0個</option>
                            <option value="1">1個</option>
                            <option value="2">2個</option>
                            <option value="3">3個</option>
                            <option value="4">4個</option>
                            <option value="5">5個</option>
                        </select>
                    </div>
                </div>
                <div class="menu-item">
                    <img src="https://placehold.co" alt="ローストビーフ弁当" class="menu-img">
                    <div class="menu-info">
                        <div class="menu-name">ローストビーフ弁当</div>
                        <div class="menu-price">¥950 (税込)</div>
                    </div>
                    <div class="menu-qty">
                        <select class="menu-qty-select" data-name="ローストビーフ弁当" data-price="950">
                            <option value="0">0個</option>
                            <option value="1">1個</option>
                            <option value="2">2個</option>
                            <option value="3">3個</option>
                            <option value="4">4個</option>
                            <option value="5">5個</option>
                        </select>
                    </div>
                </div>
                <div class="menu-item">
                    <img src="https://placehold.co" alt="鶏そぼろ弁当" class="menu-img">
                    <div class="menu-info">
                        <div class="menu-name">鶏そぼろ弁当</div>
                        <div class="menu-price">¥850 (税込)</div>
                    </div>
                    <div class="menu-qty">
                        <select class="menu-qty-select" data-name="鶏そぼろ弁当" data-price="850">
                            <option value="0">0個</option>
                            <option value="1">1個</option>
                            <option value="2">2個</option>
                            <option value="3">3個</option>
                            <option value="4">4個</option>
                            <option value="5">5個</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="section-title">👤 お客様情報</div>
            <div class="input-card">
                <div class="input-group">
                    <label for="name">お名前 <span class="required">必須</span></label>
                    <input type="text" id="name" placeholder="例：山田 太郎" required>
                </div>
                <div class="input-group">
                    <label for="phone">ご連絡先（電話番号） <span class="required">必須</span></label>
                    <input type="tel" id="phone" placeholder="例：09012345678" required>
                </div>
                <div class="input-group">
                    <label for="pickupTime">お受け取り希望日時 <span class="required">必須</span></label>
                    <select id="pickupTime" required>
                        <option value="">日時を選択してください</option>
                    </select>
                </div>
            </div>
            <div class="total-card">
                <div class="total-label">合計金額</div>
                <div id="totalPriceDisplay" class="total-price">¥0</div>
            </div>
            <button type="submit" class="submit-btn">LINEで注文内容を送信する</button>
        </form>
    </div>

    <script>
        // 🌟あなたの最新のGASのURLを貼り付けてください
        const GAS_WEB_APP_URL =
            "https://script.google.com/macros/s/AKfycbxDivSJacX6t1mF4G2AA8L_5aIs7PEeKK0eiLngfiiiKX-4yJB-olwSU69WcKInh2A_fQ/exec";

        let STOCK_CONFIG = {};
        let TIME_SLOTS_CONFIG = [];
        const qtySelects =
            document.querySelectorAll('.menu-qty-select');
        const totalPriceDisplay =
            document.getElementById('totalPriceDisplay');
        const pickupTimeSelect =
            document.getElementById('pickupTime');
        const orderForm =
            document.getElementById('orderForm');

        function loadLiveStockData(callback) {
            const refreshUrl = GAS_WEB_APP_URL +
                (GAS_WEB_APP_URL.includes('?') ? '&' : '?') +
                '_=' + new Date().getTime();
            fetch(refreshUrl, { method: 'GET', cache: 'no-store' })
                .then(res => res.json())
                .then(data => {
                    STOCK_CONFIG = data.stocks;
                    TIME_SLOTS_CONFIG = data.times || [];
                    initProductStock();
                    updatePickupTimeSlots();
                    calculateTotal();
                    if (callback) callback();
                }).catch(err => {
                    console.error("通信エラー:", err);
                    if (callback) callback();
                });
        }

        function initProductStock() {
            qtySelects.forEach(function (select) {
                const itemName = select.getAttribute('data-name');
                const maxStock = STOCK_CONFIG[itemName] !==
                    undefined ? STOCK_CONFIG[itemName] : 5;
                const menuItem = select.closest('.menu-item');
                const currentVal = select.value || "0";
                if (menuItem) {
                    const nameDisplay =
                        menuItem.querySelector('.menu-name');
                    if (maxStock <= 0 && nameDisplay) {
                        select.disabled = true;
                        nameDisplay.textContent =
                            itemName + "（売切れ）";
                        nameDisplay.style.color = "#999";
                        nameDisplay.style.fontSize = "13px";
                        while (select.options.length > 0) {
                            select.remove(0);
                        }
                        const opt = document.createElement('option');
                        opt.value = 0; opt.textContent = "0個";
                        select.appendChild(opt); return;
                    } else if (nameDisplay) {
                        select.disabled = false;
                        nameDisplay.textContent = itemName;
                        nameDisplay.style.color = "#2d3436";
                        nameDisplay.style.fontSize = "15px";
                    }
                }
                while (select.options.length > 0) {
                    select.remove(0);
                }
                const limit = Math.min(maxStock, 5);
                for (let i = 0; i <= limit; i++) {
                    const opt = document.createElement('option');
                    opt.value = i; opt.textContent = i + "個";
                    select.appendChild(opt);
                }
                if (parseInt(currentVal) <= limit) {
                    select.value = currentVal;
                } else { select.value = "0"; }
            });
        }



        function updatePickupTimeSlots() {
            if (!pickupTimeSelect) return;
            const currentVal = pickupTimeSelect.value;
            while (pickupTimeSelect.options.length > 0) {
                pickupTimeSelect.remove(0);
            }
            const defaultOption =
                document.createElement('option');
            defaultOption.value = "";
            defaultOption.textContent = "日時を選択してください";
            pickupTimeSelect.appendChild(defaultOption);
            const now = new Date();
            TIME_SLOTS_CONFIG.forEach(function (slot) {
                const targetDate = new Date();
                targetDate.setDate(now.getDate() + slot.dayOffset);
                const fullLabel = `${slot.prefix}(` +
                    `${targetDate.getMonth() + 1}月` +
                    `${targetDate.getDate()}日) ${slot.timeStr}`;
                const option = document.createElement('option');
                option.value = fullLabel;
                option.textContent = fullLabel;
                targetDate.setHours(slot.hour, slot.minute, 0, 0);
                const limitTime = new Date(
                    targetDate.getTime() - (slot.limitMin * 60 * 1000)
                );
                if (now > limitTime) {
                    option.disabled = true;
                    option.textContent += "（受付終了）";
                }
                pickupTimeSelect.appendChild(option);
            });
            if (currentVal) pickupTimeSelect.value = currentVal;
        }

        function calculateTotal() {
            let total = 0;
            qtySelects.forEach(function (select) {
                total += (parseInt(select.getAttribute('data-price'))
                    || 0) * (parseInt(select.value) || 0);
            });
            if (totalPriceDisplay) {
                totalPriceDisplay.textContent =
                    "¥" + total.toLocaleString();
            }
            return total;
        }

        STOCK_CONFIG = {
            "ハンバーグ弁当": 5, "唐揚げ弁当": 2,
            "生姜焼き弁当": 5, "カレーライス": 0,
            "シーザーサラダ": 5
        };
        TIME_SLOTS_CONFIG = [
            {
                prefix: "本日", timeStr: "11:30〜12:00",
                dayOffset: 0, hour: 11, minute: 30, limitMin: 30
            },
            {
                prefix: "本日", timeStr: "12:00〜12:30",
                dayOffset: 0, hour: 12, minute: 0, limitMin: 60
            },
            {
                prefix: "本日", timeStr: "17:30〜18:00",
                dayOffset: 0, hour: 17, minute: 30, limitMin: 30
            },
            {
                prefix: "本日", timeStr: "18:00〜18:30",
                dayOffset: 0, hour: 18, minute: 0, limitMin: 30
            },
            {
                prefix: "明日", timeStr: "12:00〜12:30",
                dayOffset: 1, hour: 12, minute: 0, limitMin: 30
            }
        ];
        initProductStock();
        updatePickupTimeSlots();
        calculateTotal();

        liff.init({ liffId: "2011383351-oeSaS7vS" })
            .then(() => {
                if (!liff.isLoggedIn()) { liff.login(); }
                loadLiveStockData();
            })
            .catch((err) => {
                console.log("LINE外:", err);
                loadLiveStockData();
            });

        qtySelects.forEach(function (select) {
            select.addEventListener('change', calculateTotal);
            select.addEventListener('focus', function () {
                loadLiveStockData();
            });
        });
        pickupTimeSelect.addEventListener('focus', function () {
            updatePickupTimeSlots();
        });




        if (orderForm) {
            orderForm.addEventListener('submit', function (e) {
                e.preventDefault();
                const submitBtn =
                    orderForm.querySelector('.submit-btn');
                if (submitBtn) {
                    submitBtn.disabled = true;
                    submitBtn.style.backgroundColor = "#95afc0";
                    submitBtn.innerText = "通信中...";
                }

                const name = document.getElementById('name').value;
                const customerPhone =
                    document.getElementById('phone').value;
                const pickupTime = pickupTimeSelect.value;

                let currentOrders = [], selectedItemsText = "",
                    lineSelectedItemsText = "", total = 0;
                qtySelects.forEach(function (select) {
                    const qty = parseInt(select.value) || 0;
                    if (qty > 0) {
                        const itemName =
                            select.getAttribute('data-name');
                        const price =
                            parseInt(select.getAttribute('data-price'))
                            || 0;
                        currentOrders.push({ name: itemName, qty: qty });
                        selectedItemsText += "・" + itemName +
                            ": " + qty + "個\n";
                        lineSelectedItemsText += "・" + itemName +
                            ": " + qty + "個\n";
                        total += price * qty;
                    }
                });

                function resetBtn() {
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.style.backgroundColor = "#06C755";
                        submitBtn.innerText =
                            "LINEで注文内容を送信する";
                    }
                }
                if (currentOrders.length === 0) {
                    alert('商品を1つ以上選択してください。');
                    resetBtn(); return;
                }
                if (!pickupTime) {
                    alert('受け取り日時を選択してください。');
                    resetBtn(); return;
                }

                const refreshUrl = GAS_WEB_APP_URL +
                    (GAS_WEB_APP_URL.includes('?') ? '&' : '?') +
                    '_=' + new Date().getTime();
                fetch(refreshUrl, { method: 'GET', cache: 'no-store' })
                    .then(res => res.json())
                    .then(data => {
                        const latestStocks = data.stocks;
                        const latestTimes = data.times || [];
                        let isSoldOutNow = false, soldOutItems = [];

                        currentOrders.forEach(function (order) {
                            const stock =
                                latestStocks[order.name] !==
                                    undefined ? latestStocks[order.name] : 0;
                            if (stock < order.qty) {
                                isSoldOutNow = true;
                                soldOutItems.push(order.name);
                            }
                        });

                        if (isSoldOutNow) {
                            let alertDiv =
                                document.getElementById('stockAlertMessage');
                            if (!alertDiv) {
                                alertDiv =
                                    document.createElement('div');
                                alertDiv.id = 'stockAlertMessage';
                                alertDiv.style.cssText =
                                    'color:#e74c3c; font-weight:bold; ' +
                                    'text-align:center; margin-top:15px; ' +
                                    'padding:12px; background:#ffeaf0; ' +
                                    'border:1px solid #e74c3c; ' +
                                    'border-radius:8px; margin-bottom:15px;';
                                submitBtn.parentNode.insertBefore(
                                    alertDiv, submitBtn
                                );
                            }
                            alertDiv.innerHTML =
                                `⚠️ 申し訳ありません！売り切れです！<br>` +
                                `【${soldOutItems.join(', ')}】が` +
                                `直前で在庫不足になりました。` +
                                `選べ直してください。`;
                            STOCK_CONFIG = latestStocks;
                            initProductStock();
                            calculateTotal();
                            resetBtn(); return;
                        }

                        const checkNow = new Date();
                        let isTimeOutNow = true;
                        latestTimes.forEach(function (slot) {
                            const tDate = new Date();
                            tDate.setDate(checkNow.getDate() +
                                slot.dayOffset);
                            const checkLabel = `${slot.prefix}(` +
                                `${tDate.getMonth() + 1}月` +
                                `${tDate.getDate()}日) ${slot.timeStr}`;
                            if (pickupTime === checkLabel) {
                                tDate.setHours(
                                    slot.hour, slot.minute, 0, 0
                                );
                                const lTime = new Date(
                                    tDate.getTime() -
                                    (slot.limitMin * 60 * 1000)
                                );
                                if (checkNow <= lTime) {
                                    isTimeOutNow = false;
                                }
                            }
                        });

                        if (isTimeOutNow) {
                            let alertDiv =
                                document.getElementById('stockAlertMessage');
                            if (!alertDiv) {
                                alertDiv =
                                    document.createElement('div');
                                alertDiv.id = 'stockAlertMessage';
                                alertDiv.style.cssText =
                                    'color:#e74c3c; font-weight:bold; ' +
                                    'text-align:center; margin-top:15px; ' +
                                    'padding:12px; background:#ffeaf0; ' +
                                    'border:1px solid #e74c3c; ' +
                                    'border-radius:8px; margin-bottom:15px;';
                                submitBtn.parentNode.insertBefore(
                                    alertDiv, submitBtn
                                );
                            }
                            alertDiv.innerHTML =
                                `⚠️ 申し訳ありません！受付時間を過ぎました！` +
                                `<br>ご選択された日時は直前で受付終了` +
                                `となりました。選べ直してください。`;
                            TIME_SLOTS_CONFIG = latestTimes;
                            updatePickupTimeSlots();
                            resetBtn(); return;
                        }

                        if (document.getElementById('stockAlertMessage'))
                            document.getElementById('stockAlertMessage')
                                .remove();

                        const confirmMessage =
                            `以下の内容で注文を送信（LINE起動）しますか？\n\n` +
                            `・お名前: ${name} 様\n` +
                            `・連絡先: ${customerPhone}\n` +
                            `【注文商品】\n${selectedItemsText}` +
                            `・合計金額: ¥${total.toLocaleString()}\n` +
                            `・受取日時: ${pickupTime}`;
                        if (!confirm(confirmMessage)) {
                            resetBtn(); return;
                        }

                        const messageText =
                            `【テイクアウト注文】\nお名前: ${name} 様\n` +
                            `連絡先: ${customerPhone}\n` +
                            `【商品内容】\n${lineSelectedItemsText}` +
                            `合計: ¥${total.toLocaleString()}\n` +
                            `受取: ${pickupTime}\n\n` +
                            `※このままお店からの返信をお待ちください。`;
                        liff.sendMessages([{
                            'type': 'text', 'text': messageText
                        }])
                            .then(function () {
                                alert("注文メッセージを送信しました！");
                                liff.closeWindow();
                            })
                            .catch(function (err) {
                                alert("送信に失敗しました。公式LINEの" +
                                    "トーク画面内でお試しください。");
                                resetBtn(); console.error(err);
                            });
                    }).catch(err => {
                        alert("通信に失敗しました。"); resetBtn();
                    });
            });
        }
    </script>
</body>

</html>

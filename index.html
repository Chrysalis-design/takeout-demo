<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>テイクアウト注文（デモ）</title>

<!-- LINEの基本システム（SDK）を読み込む -->
<script src="https://line-scdn.net"></script>

<!-- 分割したCSSファイル（style.css）を読み込む -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
<h2>テイクアウト注文</h2>
<p class="subtitle">ご希望の商品と数量、お受け取り日時を選択してください。</p>

<!-- 注文フォームの大枠 -->
<form id="orderForm">

<!-- メニューエリア -->
<div class="section-title">📦 メニュー</div>
<div class="menu-list">

<!-- ハンバーグ弁当 -->
<div class="menu-item">
<img src="https://placehold.co" alt="ハンバーグ弁当" class="menu-img">
<div class="menu-info">
<div class="menu-name">特製ハンバーグ弁当</div>
<div class="menu-price">¥850 (税込)</div>
</div>
<div class="menu-qty">
<select class="menu-qty-select" data-name="ハンバーグ弁当" data-price="850">
<!-- JSによって自動的に個数が生成されます -->
</select>
</div>
</div>

<!-- 唐揚げ弁当 -->
<div class="menu-item">
<img src="https://placehold.co" alt="唐揚げ弁当" class="menu-img">
<div class="menu-info">
<div class="menu-name">唐揚げ弁当</div>
<div class="menu-price">¥750 (税込)</div>
</div>
<div class="menu-qty">
<select class="menu-qty-select" data-name="唐揚げ弁当" data-price="750">
</select>
</div>
</div>

<!-- 生姜焼き弁当 -->
<div class="menu-item">
<img src="https://placehold.co" alt="生姜焼き弁当" class="menu-img">
<div class="menu-info">
<div class="menu-name">生姜焼き弁当</div>
<div class="menu-price">¥800 (税込)</div>
</div>
<div class="menu-qty">
<select class="menu-qty-select" data-name="生姜焼き弁当" data-price="800">
</select>
</div>
</div>

<!-- カレーライス (在庫0のテスト用) -->
<div class="menu-item">
<img src="https://placehold.co" alt="カレーライス" class="menu-img">
<div class="menu-info">
<div class="menu-name">カレーライス</div>
<div class="menu-price">¥700 (税込)</div>
</div>
<div class="menu-qty">
<select class="menu-qty-select" data-name="カレーライス" data-price="700">
</select>
</div>
</div>

<!-- シーザーサラダ -->
<div class="menu-item">
<img src="https://placehold.co" alt="シーザーサラダ" class="menu-img">
<div class="menu-info">
<div class="menu-name">シーザーサラダ</div>
<div class="menu-price">¥450 (税込)</div>
</div>
<div class="menu-qty">
<select class="menu-qty-select" data-name="シーザーサラダ" data-price="450">
</select>
</div>
</div>

</div>

<!-- お客様情報入力エリア -->
<div class="section-title">👤 お客様情報</div>
<div class="input-card">
<div class="input-group">
<label for="name">お名前 <span class="required">必須</span></label>
<input type="text" id="name" placeholder="例：山田 太郎" required>
</div>

<div class="input-group">
<label for="phone">ご連絡先（電話番号） <span class="required">必須</span></label>
<input type="tel" id="phone" placeholder="例：09012345678" required>
</div>

<div class="input-group">
<label for="pickupTime">お受け取り希望日時 <span class="required">必須</span></label>
<select id="pickupTime" required>
<option value="">日時を選択してください</option>
<!-- JSによって自動的に受取時間枠が生成されます -->
</select>
</div>
</div>

<!-- 合計金額表示 -->
<div class="total-card">
<div class="total-label">合計金額</div>
<div id="totalPriceDisplay" class="total-price">¥0</div>
</div>

<!-- 注文送信ボタン -->
<button type="submit" class="submit-btn">
<span>LINEで注文内容を送信する</span>
</button>

</form>
</div>

<!-- 分割したJavaScriptファイル（main.js）を読み込む -->
<script src="main.js"></script>
</body>
</html>
